<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body id='container'>
    <div class="container-fluid">
      <div class="row">
        <div class="col-sm-12">
          <h1>HS of Fashion Industries Summer Digital Program Card</h1>
          <p>Use the form below to look up your StudentID to pull up your program card</p>
          <p>If no courses display, check in with your home school</p>
        </div>
        
        <div class="col-12">
        <h2>Submit your StudentID Below</h2>
        <form id='student_form'>
          <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addon1">StudentID</span>
            <input type="text" class="form-control" name="StudentID" placeholder="StudentID" aria-label="StudentID" aria-describedby="basic-addon1" pattern="\d{9}" title="Enter your 9 digit StudentID" inputmode="numeric">
          </div>



          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-secondary" type="button" id="submitButton">
              <span class="btn_toggle">Submit</span>
              <span class="btn_toggle spinner-border spinner-border-sm visually-hidden" aria-hidden="true"></span>
              <span class="btn_toggle visually-hidden" role="status">Loading...</span>
          </button>
          </div>
        </form>

        </div>

        <div class="col-12">
          <div id="StudentDetails">
          </div>
        </div>

        <div class="col-12">
          <div class="accordion accordion-flush" id="accordianCourseDetails">
          </div>
        </div>



      </div>

    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>



  <script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>

  <script>
  function preventFormSubmit() {
    var forms = document.querySelectorAll('form');
    for (var i = 0; i < forms.length; i++) {
      forms[i].addEventListener('submit', function(event) {
      event.preventDefault();
      });
  }
  }
  
  window.addEventListener('load', preventFormSubmit);



  results_elements_lst = document.querySelectorAll(".results")
  courses_accordian_div = document.getElementById('accordianCourseDetails')
  student_details_div = document.getElementById('StudentDetails')
  container_div = document.getElementById('container')

  function displayStudentInfo(ret){
    // btn_toggles = document.getElementsByClassName('btn_toggle')

    // for (span of btn_toggles){
    //     span.classList.toggle('visually-hidden')
    // }

    courses_accordian_div.innerHTML = ''
    container_div.setAttribute("class","")
    
    student_info = ret[0]
    isZLTA = student_info.isZLTA
    isExamOnly = student_info.isExamOnly


    i = 0;
    for (const course of ret) {
      i++
      StudentID = course.StudentID
      lastName = course.LastName 
      firstName = course.FirstName
      room = course.Room
      courseName = course['Course Name']
      period = course.Period
      teacher = course.Teacher1
      meetingDays = course.MeetingDays
      first_period = course.FirstPeriodOfDay
      sending_school_name = course.SendingSchoolName

      course_details_str = `
      <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${i}" aria-expanded="true" aria-controls="collapse${i}">
              Period ${period} (${meetingDays}) - ${courseName} - Room ${room}
            </button>
          </h2>
          <div id="collapse${i}" class="accordion-collapse collapse" data-bs-parent="#accordianCourseDetails">
            <div class="accordion-body">
              <p>Room <strong>${room}</strong> </p>
              <p>${meetingDays}</p>
              <p>Teacher - ${teacher} </p>
            </div>
          </div>
        </div>
      `
      courses_accordian_div.innerHTML += course_details_str
    }

    student_details_div.innerHTML = `
    <h2>${firstName} ${lastName} (${StudentID}) </h2>
    <h2>First Period - ${first_period}</h2>
    <h3>${sending_school_name}</h3>
    `
    
    switch (first_period){
      case 1:
        container_div.classList.add('bg-primary')
        break;
      case 2:
        container_div.classList.add('bg-success')
        break;
      case 3:
        container_div.classList.add('bg-info')
        break;    
    }

    
    
    if (isZLTA) {
      container_div.classList.add('bg-danger')
      student_details_div.innerHTML = `
        <h2>${firstName} ${lastName} (${StudentID}) </h2>
        <h2>NO CLASSES</h2>
        <h3>${sending_school_name}</h3>
        <p>You are not enrolled in any summer school classes at this time. Connect with your home school for next steps</p>
    `
    courses_accordian_div.innerHTML = ''
    }

    if (isExamOnly) {
      container_div.classList.add('bg-warning')
      student_details_div.innerHTML = `
        <h2>${firstName} ${lastName} (${StudentID}) </h2>
        <h2>Regents Exam Only</h2>
        <h3>${sending_school_name}</h3>
        <p>You are not enrolled in any summer school classes at this time, you are signed up for August Regents Exams. You will be sent additional information in August.</p>
    `
    courses_accordian_div.innerHTML = ''
    }
  }

  function noStudentFound(ret){
    results_elements_lst.forEach(p => p.innerHTML = '');
    console.log(ret)
  }

  $( document ).ready(function() {
    $( "#student_form" ).submit(function() {
      google.script.run.withSuccessHandler(displayStudentInfo).withFailureHandler(noStudentFound).returnStudentInfo(this);
      
    });
  });
  </script>
</html>
